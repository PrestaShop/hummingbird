<div dir="rtl">
  <div class="quantity-selector" data-ps-component="quantity-selector" data-ps-context="listing" data-ps-state="idle">
    <div class="quantity-selector__group input-group" dir="ltr">
      <button type="button" class="quantity-selector__button btn btn-square-icon" id="qs_rtl_decrement" data-ps-action="quantity-decrement" aria-controls="qs_rtl" aria-disabled="false" aria-label="Decrease quantity of Hummingbird printed t-shirt">
        <i class="material-icons" aria-hidden="true">&#xE15B;</i>
      </button>
      <input id="qs_rtl" class="quantity-selector__input form-control" type="number" inputmode="numeric" step="1" name="qty" value="2" min="1" data-ps-ref="quantity-input" aria-label="Change quantity of Hummingbird printed t-shirt">
      <button type="button" class="quantity-selector__button btn btn-square-icon" id="qs_rtl_increment" data-ps-action="quantity-increment" aria-controls="qs_rtl" aria-disabled="false" aria-label="Increase quantity of Hummingbird printed t-shirt">
        <i class="material-icons" aria-hidden="true">&#xE145;</i>
      </button>
    </div>
    <span class="quantity-selector__spinner spinner-border spinner-border-sm" aria-hidden="true"></span>
    <span class="visually-hidden" data-ps-ref="quantity-status" role="status" aria-live="polite"></span>
  </div>
</div>
